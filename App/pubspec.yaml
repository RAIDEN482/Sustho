name: shustho
description: "Shustho - a free, offline-first menstruation and reproductive health tracker for Bangladesh, in Bangla and English."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  tflite_flutter: ^0.12.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/noto_bengali.ttf
